<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer in the City · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Righteous&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #F7F3EE;
    --white:   #FFFFFF;
    --ink:     #111111;
    --mid:     #666666;
    --line:    #DDDDDD;

    --cyan:    #00C8D4;
    --pink:    #F0197D;
    --yellow:  #FFE600;
    --orange:  #FF6B1A;
    --purple:  #7B2FBE;

    --in-town: var(--cyan);
    --away-s1: #F7F3EE;
    --away-s2: #D8C8D8;

    --ol2: #FFE600;
    --ol3: var(--orange);
    --ol4: var(--pink);
    --ol5: var(--purple);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── HERO ── */
  .hero {
    background: var(--white);
    border-bottom: 4px solid var(--ink);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* Diagonal stripe background */
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent 0px, transparent 18px,
      rgba(0,200,212,.12) 18px, rgba(0,200,212,.12) 22px,
      transparent 22px, transparent 40px,
      rgba(240,25,125,.09) 40px, rgba(240,25,125,.09) 44px
    );
    pointer-events: none;
  }

  /* Geometric accent shapes */
  .hero-shape1 {
    position: absolute; top: -30px; left: -30px;
    width: 160px; height: 160px;
    background: var(--yellow);
    transform: rotate(15deg);
    z-index: 0; opacity: .7;
  }
  .hero-shape2 {
    position: absolute; bottom: -20px; right: 40px;
    width: 0; height: 0;
    border-left: 80px solid transparent;
    border-right: 80px solid transparent;
    border-bottom: 140px solid var(--cyan);
    opacity: .5; z-index: 0;
  }
  .hero-shape3 {
    position: absolute; top: 20px; right: -20px;
    width: 120px; height: 120px;
    background: var(--pink);
    border-radius: 50%;
    opacity: .2; z-index: 0;
  }
  .hero-dots {
    position: absolute; bottom: 16px; left: 50px;
    display: grid; grid-template-columns: repeat(7, 10px); gap: 7px;
    z-index: 0; opacity: .5;
  }
  .hero-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--pink);
    display: block;
  }

  .hero-inner { position: relative; z-index: 1; }
  .hero-emoji { font-size: 32px; line-height: 1; margin-bottom: 10px; }

  .hero h1 {
    font-family: 'Bangers', sans-serif;
    font-size: clamp(52px, 10vw, 96px);
    line-height: .95;
    letter-spacing: .04em;
    color: var(--ink);
    text-shadow:
      4px 4px 0 var(--cyan),
      8px 8px 0 var(--pink);
    margin-bottom: 12px;
  }

  .hero-sub {
    font-family: 'Righteous', sans-serif;
    font-size: 14px;
    color: var(--mid);
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: 24px;
    background: var(--yellow);
    display: inline-block;
    padding: 4px 16px;
    border: 2px solid var(--ink);
    border-radius: 2px;
  }

  .btn-primary {
    display: inline-block;
    background: var(--pink);
    color: #fff;
    border: 3px solid var(--ink);
    border-radius: 4px;
    padding: 12px 30px;
    font-family: 'Bangers', sans-serif;
    font-size: 22px;
    letter-spacing: .08em;
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    box-shadow: 4px 4px 0 var(--ink);
    text-transform: uppercase;
  }
  .btn-primary:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink);
  }
  .btn-primary:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .wrap { max-width: 1140px; margin: 0 auto; padding: 28px 20px; }

  /* ── LEGEND ── */
  .legend-bar {
    display: flex; flex-wrap: wrap; gap: 8px 20px;
    margin-bottom: 22px; padding: 12px 18px;
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 4px;
    box-shadow: 3px 3px 0 var(--ink);
    align-items: center;
  }
  .legend-group { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink); }
  .legend-swatch { width: 20px; height: 13px; border-radius: 2px; border: 1.5px solid var(--ink); flex-shrink: 0; }
  .sw-in  { background: var(--cyan); }
  .sw-out {
    background: repeating-linear-gradient(
      -45deg,
      var(--away-s1), var(--away-s1) 3px,
      var(--away-s2) 3px, var(--away-s2) 7px
    );
  }
  .sw-ol2 { background: var(--ol2); }
  .sw-ol3 { background: var(--ol3); }
  .sw-ol4 { background: var(--ol4); }
  .legend-div { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  /* ── GANTT ── */
  .gantt-card {
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 4px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 22px;
    overflow-x: auto;
    margin-bottom: 32px;
  }
  .gantt { min-width: 680px; }

  .gantt-month-row { display: flex; margin-left: 88px; margin-bottom: 3px; }
  .month-label {
    font-family: 'Righteous', sans-serif;
    font-size: 12px; color: var(--pink);
    border-left: 2px solid var(--line);
    padding-left: 5px; letter-spacing: .06em;
    text-transform: uppercase;
  }
  .gantt-date-row { display: flex; margin-left: 88px; margin-bottom: 6px; }
  .date-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7.5px; color: var(--mid); text-align: center;
    border-left: 1px solid var(--line); padding-bottom: 3px; line-height: 1;
  }

  .gantt-body { display: flex; flex-direction: column; gap: 5px; }
  .gantt-row { display: flex; align-items: stretch; }
  .row-label {
    width: 88px; flex-shrink: 0;
    font-family: 'Righteous', sans-serif;
    font-size: 15px; letter-spacing: .03em;
    display: flex; align-items: center;
    padding-right: 10px; gap: 7px; color: var(--ink);
  }
  .row-dot {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--ink); flex-shrink: 0;
  }
  .row-cells { display: flex; flex: 1; position: relative; border: 1.5px solid var(--line); border-radius: 3px; overflow: hidden; }

  .day-cell { flex: 1; height: 26px; cursor: default; }
  .day-cell.in  { background: var(--cyan); }
  .day-cell.pending {
    background: repeating-linear-gradient(
      90deg,
      #e8e0d8 0px, #e8e0d8 4px,
      #f7f3ee 4px, #f7f3ee 8px
    );
  }
  .day-cell.out {
    background: repeating-linear-gradient(
      -45deg,
      var(--away-s1), var(--away-s1) 3px,
      var(--away-s2) 3px, var(--away-s2) 7px
    );
  }

  .gantt-row.overlap .row-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8.5px; font-weight: 700; color: var(--mid);
    text-transform: uppercase; letter-spacing: .07em;
  }
  .gantt-row.overlap .day-cell { height: 20px; }
  .gantt-row.overlap .day-cell.ol0,
  .gantt-row.overlap .day-cell.ol1 { background: transparent; }
  .gantt-row.overlap .day-cell.ol2 { background: var(--ol2); }
  .gantt-row.overlap .day-cell.ol3 { background: var(--ol3); }
  .gantt-row.overlap .day-cell.ol4 { background: var(--ol4); }
  .gantt-row.overlap .day-cell.ol5plus { background: var(--ol5); }

  .gantt-divider { margin: 8px 0 8px 88px; border: none; border-top: 2px dashed var(--line); }

  .today-marker {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--ink); pointer-events: none; z-index: 5;
  }

  /* ── TOOLTIP ── */
  .tt {
    position: fixed;
    background: var(--ink); color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600;
    padding: 5px 11px; border-radius: 3px;
    border: 2px solid var(--ink);
    pointer-events: none; z-index: 999;
    white-space: nowrap; display: none;
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'Bangers', sans-serif;
    font-size: 34px; letter-spacing: .05em;
    color: var(--ink); margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1; height: 3px;
    background: repeating-linear-gradient(90deg, var(--ink) 0px, var(--ink) 8px, transparent 8px, transparent 13px);
  }

  /* ── PEOPLE GRID ── */
  .people-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px; margin-bottom: 40px;
  }

  .person-card {
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 4px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 18px;
    transition: transform .1s, box-shadow .1s;
  }
  .person-card:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .person-card-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 12px;
  }
  .person-name-row { display: flex; align-items: center; gap: 8px; }
  .person-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--ink);
  }
  .person-name { font-family: 'Bangers', sans-serif; font-size: 22px; letter-spacing: .05em; }

  .btn-edit-person {
    background: none; border: 2px solid var(--ink); border-radius: 3px;
    padding: 3px 10px; font-size: 10px; font-weight: 700;
    cursor: pointer; color: var(--ink);
    font-family: 'Righteous', sans-serif; letter-spacing: .07em;
    text-transform: uppercase;
    transition: all .1s;
  }
  .btn-edit-person:hover { background: var(--ink); color: var(--white); }

  .away-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .away-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    font-size: 12px; background: var(--bg);
    border-radius: 3px; padding: 7px 10px;
    border-left: 4px solid var(--pink);
  }
  .away-label { font-weight: 700; color: var(--ink); }
  .away-dates { color: var(--mid); font-size: 10px; margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .btn-del {
    background: none; border: none; font-size: 16px; cursor: pointer;
    color: var(--mid); padding: 0; line-height: 1; flex-shrink: 0; margin-left: 6px;
  }
  .btn-del:hover { color: var(--pink); }

  .status-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; padding: 4px 10px;
    border-radius: 3px; border: 2px dashed;
  }
  .status-tag.awaiting {
    color: var(--orange); border-color: var(--orange);
    background: #FFF5EE;
  }

  /* ── HANGOUT SECTION ── */
  .hangout-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .hangout-card {
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 4px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: transform .1s, box-shadow .1s;
  }
  .hangout-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--ink);
  }
  .hangout-card .accent-stripe {
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: repeating-linear-gradient(90deg,
      var(--cyan) 0px, var(--cyan) 16px,
      var(--yellow) 16px, var(--yellow) 32px,
      var(--pink) 32px, var(--pink) 48px
    );
  }
  .hangout-card.hot .accent-stripe {
    background: repeating-linear-gradient(90deg,
      var(--pink) 0px, var(--pink) 16px,
      var(--yellow) 16px, var(--yellow) 32px,
      var(--orange) 32px, var(--orange) 48px
    );
  }
  .hangout-card-inner { padding-top: 8px; }

  .hc-dates {
    font-family: 'Bangers', sans-serif;
    font-size: 22px; color: var(--ink);
    letter-spacing: .03em; margin-bottom: 6px;
  }
  .hc-count {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    margin-bottom: 10px; font-family: 'Righteous', sans-serif;
  }
  .hc-count.all  { color: var(--pink); }
  .hc-count.most { color: var(--orange); }
  .hc-count.some { color: var(--cyan); }
  .hc-names { display: flex; flex-wrap: wrap; gap: 5px; }
  .hc-pill {
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 2px;
    border: 2px solid var(--ink);
    color: var(--ink); background: var(--bg);
    font-family: 'Righteous', sans-serif;
    letter-spacing: .04em;
  }
  .hc-duration {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--mid); margin-top: 10px;
  }
  .no-hangouts {
    grid-column: 1/-1; text-align: center;
    color: var(--mid); font-size: 14px; padding: 24px;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 100;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    border-radius: 4px; padding: 28px;
    width: 100%; max-width: 480px; max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Bangers', sans-serif;
    font-size: 30px; letter-spacing: .05em;
    color: var(--pink); margin-bottom: 6px;
  }
  .modal-sub { font-size: 13px; color: var(--mid); margin-bottom: 22px; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--mid); margin-bottom: 7px;
    font-family: 'Righteous', sans-serif;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 13px;
    background: var(--bg); border: 2px solid var(--ink);
    border-radius: 3px; font-size: 14px; font-family: inherit;
    color: var(--ink); outline: none; transition: border-color .15s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--pink); }

  .period-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .period-item {
    background: var(--bg); border: 2px solid var(--line);
    border-radius: 4px; padding: 13px; position: relative;
  }
  .period-item .dates-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;
  }
  .mini-label {
    font-size: 10px; font-weight: 700; color: var(--mid);
    text-transform: uppercase; letter-spacing: .09em;
    display: block; margin-bottom: 5px;
    font-family: 'Righteous', sans-serif;
  }
  .period-item .btn-remove {
    position: absolute; top: 9px; right: 10px; background: none; border: none;
    font-size: 17px; cursor: pointer; color: var(--mid); line-height: 1; padding: 0;
  }
  .period-item .btn-remove:hover { color: var(--pink); }

  .btn-add-period {
    background: none; border: 2px dashed var(--line); border-radius: 3px;
    width: 100%; padding: 10px; font-size: 12px; font-weight: 700;
    color: var(--mid); cursor: pointer; transition: all .15s; font-family: inherit;
    text-transform: uppercase; letter-spacing: .07em;
  }
  .btn-add-period:hover { border-color: var(--cyan); color: var(--cyan); }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-save {
    flex: 1; background: var(--pink); color: #fff;
    border: 3px solid var(--ink);
    border-radius: 3px; padding: 12px;
    font-family: 'Bangers', sans-serif; font-size: 20px; letter-spacing: .06em;
    cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s; text-transform: uppercase;
  }
  .btn-save:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn-cancel {
    background: none; border: 2px solid var(--line); border-radius: 3px;
    padding: 12px 20px; font-size: 13px; font-weight: 700;
    cursor: pointer; color: var(--mid); transition: all .15s; font-family: inherit;
  }
  .btn-cancel:hover { border-color: var(--ink); color: var(--ink); }

  /* Status */
  .status-bar {
    font-size: 12px; color: var(--mid); text-align: center;
    padding: 8px; min-height: 28px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .status-bar.error  { color: var(--pink); }
  .status-bar.saving { color: var(--cyan); }
  .status-bar.ok     { color: #16A34A; }

  @media (max-width: 600px) {
    .hero h1 { font-size: 48px; }
    .gantt-card { padding: 12px; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<!-- Error banner -->
<div id="error-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:1000;
  background:#F0197D;color:#fff;padding:14px 20px;
  font-family:'Bangers',sans-serif;font-size:22px;letter-spacing:.06em;
  text-align:center;border-bottom:3px solid #111;box-shadow:0 4px 0 #111;">
  ⚠️ <span id="error-banner-msg"></span>
  &nbsp;&nbsp;<button onclick="document.getElementById('error-banner').style.display='none'"
    style="background:#fff;color:#F0197D;border:2px solid #111;border-radius:3px;
    padding:2px 12px;font-family:'Bangers',sans-serif;font-size:18px;cursor:pointer;
    box-shadow:2px 2px 0 #111;">Dismiss</button>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-shape1"></div>
  <div class="hero-shape2"></div>
  <div class="hero-shape3"></div>
  <div class="hero-dots">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="hero-inner">
    <div class="hero-emoji">😎 🌴 🗽 🌊 🎸</div>
    <h1>Gala 2026 Summer Schedule</h1>
    <div class="hero-sub">☀️ &nbsp;Jun 8 – Sep 7, 2026 · New York City&nbsp; ☀️</div>
    <br>
    <button class="btn-primary" onclick="openEditModal()">+ Update My Dates</button>
  </div>
</div>

<div class="wrap">

  <!-- LEGEND -->
  <div class="legend-bar">
    <div class="legend-group"><div class="legend-swatch sw-in"></div>In NYC</div>
    <div class="legend-group"><div class="legend-swatch sw-out"></div>Away</div>
    <div class="legend-group"><div class="legend-swatch" style="background:repeating-linear-gradient(90deg,#e8e0d8 0px,#e8e0d8 4px,#f7f3ee 4px,#f7f3ee 8px);border:1.5px solid #ccc"></div>Awaiting dates</div>
    <div class="legend-div"></div>
    <div class="legend-group"><div class="legend-swatch sw-ol2"></div>2 in town</div>
    <div class="legend-group"><div class="legend-swatch sw-ol3"></div>3 in town</div>
    <div class="legend-group"><div class="legend-swatch sw-ol4" style="background:var(--ol4)"></div>4 in town</div>
  </div>

  <!-- GANTT -->
  <div class="gantt-card">
    <div class="gantt" id="gantt"></div>
  </div>

  <!-- CREW -->
  <div class="section-title">🏙️ The Crew</div>
  <div class="people-grid" id="people-grid"></div>

  <!-- HANGOUTS -->
  <div class="section-title">🎉 Plan a Hangout</div>
  <div class="hangout-grid" id="hangout-grid"></div>

  <div class="status-bar" id="status"></div>
</div>

<div class="tt" id="tooltip"></div>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-overlay" onclick="handleOverlayClick(event,'edit-overlay')">
  <div class="modal">
    <h2 id="modal-title">Update My Dates</h2>
    <p class="modal-sub">Pick your name and add any trips away from NYC.</p>

    <div class="form-group">
      <label>Your name</label>
      <select id="name-select" onchange="onNameChange()">
        <option value="">— who are you? —</option>
        <option value="__new__">+ Add a new person</option>
      </select>
    </div>

    <div class="form-group" id="new-name-group" style="display:none">
      <label>Enter your name</label>
      <input type="text" id="new-name-input" placeholder="First name" maxlength="30">
    </div>

    <div>
      <label class="mini-label" style="margin-bottom:10px;display:block">Away from NYC</label>
      <div class="period-list" id="away-period-list"></div>
      <button class="btn-add-period" onclick="addAwayPeriod()">+ Add a Trip</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('edit-overlay')">Cancel</button>
      <button class="btn-save" onclick="savePersonData()">Save It!</button>
    </div>
  </div>
</div>

<script>
  const REPO_OWNER = 'Shuroscience';
  const REPO_NAME  = 'summer-2026';
  const DATA_FILE  = 'data.json';
  const READ_URL   = '/.netlify/functions/read';

  const SUMMER_START = new Date(Date.UTC(2026, 5, 8));
  const SUMMER_END   = new Date(Date.UTC(2026, 8, 7));
  const TOTAL_DAYS   = Math.round((SUMMER_END - SUMMER_START) / 86400000) + 1;
  const PERSON_COLORS = ['#F0197D','#00C8D4','#7B2FBE','#FF6B1A','#FFE600','#16A34A'];

  // Names pre-seeded (won't add dates by default — awaiting their input)
  const SEEDED_NAMES = new Set(['Caitlin','Luciana','Geo','Deebs']);

  let state = { people: [] };

  function dayIndex(iso) {
    return Math.round((new Date(iso + 'T00:00:00Z') - SUMMER_START) / 86400000);
  }
  function isoFromIndex(i) {
    return new Date(SUMMER_START.getTime() + i * 86400000).toISOString().slice(0,10);
  }
  function isConfirmed(person) {
    return person.confirmed === true || person.away.length > 0;
  }
  function isAway(person, idx) {
    return person.away.some(a => dayIndex(a.start) <= idx && idx <= dayIndex(a.end));
  }
  function awayAt(person, idx) {
    return person.away.find(a => dayIndex(a.start) <= idx && idx <= dayIndex(a.end));
  }
  function formatDate(iso) {
    return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  }
  function formatDateLong(iso) {
    return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
  }
  function monthName(m) {
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m];
  }

  // ── Fetch / Save ──
  async function fetchData() {
    setStatus('Loading…');
    try {
      const res = await fetch(READ_URL);
      if (!res.ok) throw new Error(res.status);
      state = await res.json();
      render();
      setStatus('');
    } catch(e) {
      setStatus('Could not load: ' + e.message, 'error');
    }
  }

  async function pushPerson(person) {
    setStatus('Saving…', 'saving');
    try {
      const res = await fetch('/.netlify/functions/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ personName: person.name, away: person.away, color: person.color })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || res.status);
      }
      setStatus('Saved ✓', 'ok');
      setTimeout(() => setStatus(''), 2500);
      return true;
    } catch(e) {
      showError(`Save failed: ${e.message}. Your changes were NOT saved — please try again.`);
      setStatus('');
      return false;
    }
  }

  function showError(msg) {
    document.getElementById('error-banner-msg').textContent = msg;
    document.getElementById('error-banner').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setStatus(msg, cls='') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status-bar' + (cls ? ' ' + cls : '');
  }

  // ── Render ──
  function render() {
    renderGantt();
    renderPeopleGrid();
    renderHangouts();
    populateNameSelect();
  }

  function renderGantt() {
    const el = document.getElementById('gantt');

    const months = [];
    let curM = -1, curStart = 0;
    for (let i = 0; i < TOTAL_DAYS; i++) {
      const m = new Date(SUMMER_START.getTime() + i * 86400000).getUTCMonth();
      if (m !== curM) {
        if (curM !== -1) months.push({ name: monthName(curM), count: i - curStart });
        curM = m; curStart = i;
      }
    }
    months.push({ name: monthName(curM), count: TOTAL_DAYS - curStart });

    const todayIdx = dayIndex(new Date().toISOString().slice(0,10));
    const todayPct = (todayIdx / TOTAL_DAYS) * 100;
    const todayVisible = todayIdx >= 0 && todayIdx < TOTAL_DAYS;

    let html = '';

    // Month labels
    html += `<div class="gantt-month-row">`;
    months.forEach(m => {
      html += `<div class="month-label" style="width:${(m.count/TOTAL_DAYS)*100}%">${m.name}</div>`;
    });
    html += `</div>`;

    // Date labels
    html += `<div class="gantt-date-row">`;
    for (let i = 0; i < TOTAL_DAYS; i++) {
      const d = new Date(SUMMER_START.getTime() + i * 86400000);
      const label = (i === 0 || d.getUTCDay() === 1) ? d.getUTCDate() : '';
      html += `<div class="date-cell" style="width:${(1/TOTAL_DAYS)*100}%">${label}</div>`;
    }
    html += `</div>`;

    html += `<div class="gantt-body">`;

    state.people.forEach(p => {
      html += `<div class="gantt-row">`;
      html += `<div class="row-label"><div class="row-dot" style="background:${p.color}"></div>${p.name}</div>`;
      html += `<div class="row-cells">`;
      if (todayVisible) html += `<div class="today-marker" style="left:${todayPct}%"></div>`;
      for (let i = 0; i < TOTAL_DAYS; i++) {
        const confirmed = isConfirmed(p);
        const away = confirmed && isAway(p, i);
        const info = away ? awayAt(p, i) : null;
        const cellClass = !confirmed ? 'pending' : away ? 'out' : 'in';
        const tt = !confirmed
          ? `${p.name} — awaiting dates · ${formatDate(isoFromIndex(i))}`
          : away
            ? `${p.name} ✈ ${info?.label||'away'} · ${formatDate(isoFromIndex(i))}`
            : `${p.name} 🗽 NYC · ${formatDate(isoFromIndex(i))}`;
        html += `<div class="day-cell ${cellClass}" data-tt="${tt}"
          onmouseenter="showTT(event,this)" onmouseleave="hideTT()"></div>`;
      }
      html += `</div></div>`;
    });

    html += `<hr class="gantt-divider">`;

    // Overlap row
    html += `<div class="gantt-row overlap">`;
    html += `<div class="row-label">In NYC</div>`;
    html += `<div class="row-cells">`;
    if (todayVisible) html += `<div class="today-marker" style="left:${todayPct}%;top:-8px"></div>`;
    for (let i = 0; i < TOTAL_DAYS; i++) {
      const confirmed = state.people.filter(p => isConfirmed(p));
      const inTown = confirmed.filter(p => !isAway(p, i)).length;
      const total  = confirmed.length;
      let cls = 'ol0';
      if (inTown >= 5) cls = 'ol5plus';
      else if (inTown === 4) cls = 'ol4';
      else if (inTown === 3) cls = 'ol3';
      else if (inTown === 2) cls = 'ol2';
      else if (inTown === 1) cls = 'ol1';
      const names = confirmed.filter(p => !isAway(p, i)).map(p => p.name).join(', ') || 'Everyone away';
      const tt = `${names} · ${formatDate(isoFromIndex(i))}`;
      html += `<div class="day-cell ${cls}" data-tt="${tt}"
        onmouseenter="showTT(event,this)" onmouseleave="hideTT()"></div>`;
    }
    html += `</div></div></div>`;

    el.innerHTML = html;
  }

  function renderPeopleGrid() {
    const el = document.getElementById('people-grid');
    let html = '';
    state.people.forEach(p => {
      const hasConfirmed = p.away.length > 0 || (p.confirmed === true);
      html += `<div class="person-card">
        <div class="person-card-head">
          <div class="person-name-row">
            <div class="person-dot" style="background:${p.color}"></div>
            <span class="person-name">${p.name}</span>
          </div>
          <button class="btn-edit-person" onclick="openEditModal('${p.name}')">Edit</button>
        </div>`;

      if (p.away.length === 0) {
        html += `<span class="status-tag awaiting">⏳ Awaiting dates</span>`;
      } else {
        html += `<ul class="away-list">`;
        p.away.forEach((a, idx) => {
          html += `<li class="away-item">
            <div>
              <div class="away-label">${a.label || 'Away'}</div>
              <div class="away-dates">${formatDate(a.start)} → ${formatDate(a.end)}</div>
            </div>
            <button class="btn-del" onclick="deleteAway('${p.name}',${idx})">×</button>
          </li>`;
        });
        html += `</ul>`;
      }
      html += `</div>`;
    });
    el.innerHTML = html;
  }

  // ── Hangout suggestions ──
  function renderHangouts() {
    const el = document.getElementById('hangout-grid');
    const total = state.people.length;
    if (total < 2) {
      el.innerHTML = `<div class="no-hangouts">Add more people to see hangout suggestions.</div>`;
      return;
    }

    const confirmed = state.people.filter(p => isConfirmed(p));
    const threshold = Math.min(3, confirmed.length);

    // Break whenever the exact set of in-town people changes
    const windows = [];
    let runStart = null, runKey = null;

    for (let i = 0; i < TOTAL_DAYS; i++) {
      const inTown = confirmed.filter(p => !isAway(p, i));
      const key = inTown.map(p => p.name).sort().join(',');
      if (inTown.length >= threshold) {
        if (key !== runKey) {
          if (runStart !== null) windows.push({ start: runStart, end: i - 1, names: runKey.split(',') });
          runStart = i; runKey = key;
        }
      } else {
        if (runStart !== null) { windows.push({ start: runStart, end: i - 1, names: runKey.split(',') }); runStart = null; runKey = null; }
      }
    }
    if (runStart !== null) windows.push({ start: runStart, end: TOTAL_DAYS - 1, names: runKey.split(',') });

    if (windows.length === 0) {
      el.innerHTML = `<div class="no-hangouts">No windows with 3+ people in town yet — more dates coming soon!</div>`;
      return;
    }

    // Sort chronologically, no limit — show them all
    windows.sort((a,b) => a.start - b.start);
    const top = windows;

    let html = '';
    top.forEach(run => {
      const days = run.end - run.start + 1;
      const isAll = run.names.length === confirmed.length;
      const countCls = isAll ? 'all' : run.names.length >= 3 ? 'most' : 'some';
      const countLabel = isAll ? '🔥 EVERYONE IN TOWN' : `${run.names.length} of ${confirmed.length} in town`;
      const displayNames = run.names;
      const startIso = isoFromIndex(run.start);
      const endIso   = isoFromIndex(run.end);
      const dateLabel = days === 1 ? formatDateLong(startIso) : `${formatDate(startIso)} – ${formatDate(endIso)}`;

      html += `<div class="${isAll ? 'hangout-card hot' : 'hangout-card'}">
        <div class="accent-stripe"></div>
        <div class="hangout-card-inner">
          <div class="hc-dates">${dateLabel}</div>
          <div class="hc-count ${countCls}">${countLabel}</div>
          <div class="hc-names">`;
      displayNames.forEach(name => {
        html += `<span class="hc-pill">${name}</span>`;
      });
      html += `</div><div class="hc-duration">${days} day${days > 1 ? 's' : ''}</div>
        </div>
      </div>`;
    });
    el.innerHTML = html;
  }

  // ── Tooltip ──
  function showTT(e, el) {
    const tt = document.getElementById('tooltip');
    tt.textContent = el.dataset.tt;
    tt.style.display = 'block';
    moveTT(e);
  }
  function hideTT() { document.getElementById('tooltip').style.display = 'none'; }
  document.addEventListener('mousemove', e => {
    if (document.getElementById('tooltip').style.display === 'block') moveTT(e);
  });
  function moveTT(e) {
    const tt = document.getElementById('tooltip');
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top  = (e.clientY - 38) + 'px';
  }

  // ── Delete ──
  async function deleteAway(name, idx) {
    const p = state.people.find(x => x.name === name);
    if (!p) return;
    p.away.splice(idx, 1);
    render();
    await pushPerson(p);
  }

  // ── Modal ──
  function populateNameSelect() {
    const sel = document.getElementById('name-select');
    const cur = sel.value;
    sel.innerHTML = `<option value="">— who are you? —</option>`;
    state.people.forEach(p => {
      sel.innerHTML += `<option value="${p.name}"${p.name===cur?' selected':''}>${p.name}</option>`;
    });
    sel.innerHTML += `<option value="__new__">+ Add a new person</option>`;
  }

  function openEditModal(name) {
    populateNameSelect();
    const newGroup = document.getElementById('new-name-group');
    if (name) {
      document.getElementById('name-select').value = name;
      newGroup.style.display = 'none';
      document.getElementById('modal-title').textContent = `Edit ${name}'s Dates`;
      loadAwayPeriods(name);
    } else {
      document.getElementById('name-select').value = '';
      newGroup.style.display = 'none';
      document.getElementById('modal-title').textContent = 'Update My Dates';
      document.getElementById('away-period-list').innerHTML = '';
    }
    document.getElementById('edit-overlay').classList.add('open');
  }

  function onNameChange() {
    const val = document.getElementById('name-select').value;
    const newGroup = document.getElementById('new-name-group');
    if (val === '__new__') {
      newGroup.style.display = 'block';
      document.getElementById('away-period-list').innerHTML = '';
      document.getElementById('modal-title').textContent = 'Add New Person';
    } else if (val) {
      newGroup.style.display = 'none';
      document.getElementById('modal-title').textContent = `Edit ${val}'s Dates`;
      loadAwayPeriods(val);
    } else {
      newGroup.style.display = 'none';
      document.getElementById('away-period-list').innerHTML = '';
    }
  }

  function loadAwayPeriods(name) {
    const p = state.people.find(x => x.name === name);
    document.getElementById('away-period-list').innerHTML = '';
    if (p) p.away.forEach(a => addAwayPeriod(a.start, a.end, a.label));
  }

  function addAwayPeriod(start='', end='', label='') {
    const list = document.getElementById('away-period-list');
    const div = document.createElement('div');
    div.className = 'period-item';
    div.innerHTML = `
      <button class="btn-remove" onclick="this.closest('.period-item').remove()">×</button>
      <div class="dates-row">
        <div>
          <span class="mini-label">Depart</span>
          <input type="date" class="start-date" value="${start}" min="2026-06-08" max="2026-09-07">
        </div>
        <div>
          <span class="mini-label">Return</span>
          <input type="date" class="end-date" value="${end}" min="2026-06-08" max="2026-09-07">
        </div>
      </div>
      <span class="mini-label">Where?</span>
      <input type="text" class="trip-label" value="${label}" placeholder="Hamptons, Italy, the moon…" maxlength="40">`;
    list.appendChild(div);
  }

  async function savePersonData() {
    const sel = document.getElementById('name-select');
    let name = sel.value;
    if (name === '__new__') {
      name = document.getElementById('new-name-input').value.trim();
      if (!name) { alert('Please enter your name.'); return; }
    }
    if (!name) { alert('Please pick your name.'); return; }

    const away = [];
    let valid = true;
    document.querySelectorAll('.period-item').forEach(item => {
      const start = item.querySelector('.start-date').value;
      const end   = item.querySelector('.end-date').value;
      const label = item.querySelector('.trip-label').value.trim();
      if (start && end) {
        if (end < start) { alert('Return date must be after departure.'); valid = false; return; }
        away.push({ start, end, label: label || 'Away' });
      }
    });
    if (!valid) return;
    away.sort((a,b) => a.start.localeCompare(b.start));

    let person = state.people.find(p => p.name === name);
    if (person) {
      person.away = away;
      person.confirmed = true;
    } else {
      const colorIdx = state.people.length % PERSON_COLORS.length;
      person = { name, color: PERSON_COLORS[colorIdx], away, confirmed: true };
      state.people.push(person);
    }

    closeModal('edit-overlay');
    render();
    await pushPerson(person);
  }

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function handleOverlayClick(e, id) {
    if (e.target === document.getElementById(id)) closeModal(id);
  }

  fetchData();
</script>
</body>
</html>
